name: Build J2ME NST FPS (Treo background fix)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nst-fps-debug.yml'
      - 'patches/**'

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch and workflow
        uses: actions/checkout@v4

      - name: Download exact source snapshot from previous GitHub Actions run
        uses: actions/download-artifact@v4
        with:
          name: J2ME-NST-FPS-TREO-v3-source
          path: source-artifact
          run-id: 41289701011
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract project and apply renderer lifecycle fix
        run: |
          set -euxo pipefail
          INNER="$(find source-artifact -type f -name '*.zip' -print -quit)"
          test -n "$INNER"
          mkdir extracted
          unzip -q "$INNER" -d extracted
          PROJECT="$(find extracted -type f -name gradlew -printf '%h\n' | head -n 1)"
          test -n "$PROJECT"
          cp patches/treo-background-renderer.patch "$PROJECT/treo-background-renderer.patch"
          cd "$PROJECT"
          patch --batch --forward -p1 < treo-background-renderer.patch
          rm treo-background-renderer.patch
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;22.1.7171670"

      - name: Ensure TinySoundFont is present
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./scripts/fetch-tinysoundfont.sh

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleEmulatorDebug --no-daemon

      - name: Upload patched APK and source
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-NST-FPS-TREO-background-fix
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/emulator/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/src/main/java/javax/microedition/lcdui/Canvas.java
          if-no-files-found: error
