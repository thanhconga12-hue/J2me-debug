name: Build J2ME NST FPS (debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/apply_treo.py
      - .github/workflows/nst-fps-debug.yml

permissions:
  contents: read

jobs:
  export-original-nst:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Export original NST APK unchanged
        run: |
          set -euo pipefail
          test -s J2ME_NST.apk
          mkdir -p original-nst
          cp J2ME_NST.apk original-nst/J2ME_NST.apk
          sha256sum original-nst/J2ME_NST.apk > original-nst/SHA256SUMS
      - name: Upload original NST APK for inspection
        uses: actions/upload-artifact@v4
        with:
          name: NST-original-APK-reference
          path: original-nst/
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;22.1.7171670"

      - name: Extract v3 source archive
        run: |
          set -euo pipefail
          test -f J2ME_NST_FPS_Rebuild_v3_Source.zip
          mkdir -p extracted
          unzip -q J2ME_NST_FPS_Rebuild_v3_Source.zip -d extracted
          test -f extracted/J2ME_NST_FPS_Rebuild/gradlew
          test -d extracted/J2ME_NST_FPS_Rebuild/app

      - name: Locate legacy Treo service in source and packaged dependencies
        run: |
          set -euo pipefail
          python3 scripts/inspect_treo_dependencies.py

      - name: Apply and validate NST Treo lifecycle integration
        run: |
          set -euo pipefail
          cd extracted/J2ME_NST_FPS_Rebuild
          python3 "$GITHUB_WORKSPACE/scripts/apply_treo.py" "$PWD"
          python3 "$GITHUB_WORKSPACE/scripts/apply_treo_lifecycle.py" "$PWD"
          python3 "$GITHUB_WORKSPACE/scripts/validate_treo_lifecycle.py" "$PWD"
      - name: Fetch TinySoundFont dependency
        working-directory: extracted/J2ME_NST_FPS_Rebuild
        run: bash ./scripts/fetch-tinysoundfont.sh

      - name: Build emulator debug APK
        working-directory: extracted/J2ME_NST_FPS_Rebuild
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleEmulatorDebug --no-daemon --stacktrace

      - name: Package patched source archive
        run: |
          set -euo pipefail
          cd extracted
          zip -qr ../J2ME_NST_FPS_Rebuild_v3_TREO_Source_GitHub.zip J2ME_NST_FPS_Rebuild
          cd ..
          test -s J2ME_NST_FPS_Rebuild_v3_TREO_Source_GitHub.zip

      - name: Upload patched source archive
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-NST-FPS-TREO-v3-source
          path: J2ME_NST_FPS_Rebuild_v3_TREO_Source_GitHub.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-NST-FPS-TREO-v3-debug
          path: extracted/J2ME_NST_FPS_Rebuild/app/build/outputs/apk/emulator/debug/*.apk
          if-no-files-found: error
          retention-days: 14
