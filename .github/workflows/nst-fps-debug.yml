name: Build J2ME NST FPS (debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/apply_treo.py
      - .github/workflows/nst-fps-debug.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;22.1.7171670"

      - name: Extract v3 source archive
        run: |
          set -euo pipefail
          test -f J2ME_NST_FPS_Rebuild_v3_Source.zip
          mkdir -p extracted
          unzip -q J2ME_NST_FPS_Rebuild_v3_Source.zip -d extracted
          test -f extracted/J2ME_NST_FPS_Rebuild/gradlew
          test -d extracted/J2ME_NST_FPS_Rebuild/app

      - name: Locate legacy Treo service in source and packaged dependencies
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q J2ME_NST_FPS_Rebuild_v3_Source.zip -d extracted
          python3 scripts/inspect_treo_dependencies.py

      - name: Apply and validate NST Treo lifecycle integration
        run: |
          set -euo pipefail
          cd extracted/J2ME_NST_FPS_Rebuild
          python3 "$GITHUB_WORKSPACE/scripts/apply_treo.py" "$PWD"
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path("app/src/main")
          ET.parse(root / "AndroidManifest.xml")
          for path in (root / "res").rglob("*.xml"):
              ET.parse(path)
          service = pathlib.Path("app/src/main/java/javax/microedition/shell/TreoOnlineService.java").read_text()
          lifecycle = pathlib.Path("app/src/main/java/javax/microedition/shell/MidletThread.java").read_text()
          activity = pathlib.Path("app/src/main/java/javax/microedition/shell/MicroActivity.java").read_text()
          assert 'android:process=":midlet"' in (root / "AndroidManifest.xml").read_text()
          assert "FOREGROUND_SERVICE_SPECIAL_USE" in (root / "AndroidManifest.xml").read_text()
          assert "active = true" in service and "WakeLock" in service
          assert "if (!TreoOnlineService.isEnabled())" in lifecycle
          assert "moveTaskToBack(true)" in activity
          assert "WeakReference" not in service
          print("Manifest/resource XML and Treo lifecycle checks passed")
          PY

      - name: Fetch TinySoundFont dependency
        working-directory: extracted/J2ME_NST_FPS_Rebuild
        run: bash ./scripts/fetch-tinysoundfont.sh

      - name: Build emulator debug APK
        working-directory: extracted/J2ME_NST_FPS_Rebuild
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleEmulatorDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-NST-FPS-TREO-v3-debug
          path: extracted/J2ME_NST_FPS_Rebuild/app/build/outputs/apk/emulator/debug/*.apk
          if-no-files-found: error
          retention-days: 14
