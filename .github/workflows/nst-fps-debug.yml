name: Build J2ME NST FPS (debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;22.1.7171670"

      - name: Extract v3 source archive
        run: |
          unzip -q J2ME_NST_FPS_Rebuild_v3_Source.zip -d extracted
          test -f extracted/J2ME_NST_FPS_Rebuild/gradlew
          test -d extracted/J2ME_NST_FPS_Rebuild/app

      - name: Fetch TinySoundFont
        working-directory: extracted/J2ME_NST_FPS_Rebuild
        run: bash ./scripts/fetch-tinysoundfont.sh

      - name: Build debug APK
        working-directory: extracted/J2ME_NST_FPS_Rebuild
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleEmulatorDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-NST-FPS-debug
          path: extracted/J2ME_NST_FPS_Rebuild/app/build/outputs/apk/emulator/debug/*.apk
          if-no-files-found: error
