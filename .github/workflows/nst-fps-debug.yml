name: Replace repository with extracted Treo source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nst-fps-debug.yml

permissions:
  actions: read
  contents: write

jobs:
  replace-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and extract edited source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41307038487 \
            --repo thanhconga12-hue/J2me-debug \
            --name J2ME-NST-FPS-TREO-v3-source \
            --dir /tmp/nst-artifact
          INNER="$(find /tmp/nst-artifact -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$INNER"
          unzip -tq "$INNER"
          mkdir -p /tmp/nst-source
          unzip -q "$INNER" -d /tmp/nst-source
          PROJECT=/tmp/nst-source/J2ME_NST_FPS_Rebuild
          test -d "$PROJECT/app/src/main"
          test -f "$PROJECT/gradlew"
          echo "Source project located: $PROJECT"
          echo "Source files before excluding generated build output:"
          find "$PROJECT" -type f | wc -l

      - name: Replace all repository files with source project
        run: |
          set -euo pipefail
          PROJECT=/tmp/nst-source/J2ME_NST_FPS_Rebuild
          # Keep source, resources, Gradle configuration and project metadata.
          # Exclude only generated Gradle/build outputs from the extracted artifact.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='.gradle/' \
            --exclude='build/' \
            --exclude='*/build/' \
            "$PROJECT/" "$GITHUB_WORKSPACE/"
          test -d app/src/main
          test -f gradlew
          echo "Final tracked candidate files:"
          find . -type f -not -path './.git/*' | wc -l
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already matches extracted source; no commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Replace repository with extracted edited NST source"
            git push origin HEAD:main
          fi
