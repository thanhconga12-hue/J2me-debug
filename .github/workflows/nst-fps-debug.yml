name: Build J2ME NST FPS (debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;22.1.7171670"

      - name: Extract v3 source archive
        run: |
          test -f J2ME_NST_FPS_Rebuild_v3_Source.zip
          mkdir -p extracted
          unzip -q J2ME_NST_FPS_Rebuild_v3_Source.zip -d extracted
          test -f extracted/J2ME_NST_FPS_Rebuild/gradlew
          test -d extracted/J2ME_NST_FPS_Rebuild/app

      - name: Apply NST keep-alive patch
        run: |
          base64 -d NST_TREO_KEEPALIVE.patch.gz.b64 | gzip -d > NST_TREO_KEEPALIVE.patch
          cd extracted/J2ME_NST_FPS_Rebuild
          git init -q
          git apply "$GITHUB_WORKSPACE/NST_TREO_KEEPALIVE.patch"
          grep -q 'class TreoOnlineService' app/src/main/java/ru/playsoftware/j2meloader/keepalive/TreoOnlineService.java
          grep -q 'TreoOnlineService.isActive(activity)' app/src/main/java/javax/microedition/shell/MidletThread.java
          grep -q 'pauseIfBackground' app/src/main/java/javax/microedition/shell/MidletThread.java
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' app/src/main/AndroidManifest.xml
          grep -q 'action_treo_online' app/src/main/res/menu/midlet_displayable.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('app/src/main/AndroidManifest.xml')
          ET.parse('app/src/main/res/menu/midlet_displayable.xml')
          ET.parse('app/src/main/res/values/strings.xml')
          print('Treo manifest/menu/resources XML validated')
          PY

      - name: Fetch TinySoundFont dependency
        working-directory: extracted/J2ME_NST_FPS_Rebuild
        run: bash ./scripts/fetch-tinysoundfont.sh

      - name: Build emulator debug APK
        working-directory: extracted/J2ME_NST_FPS_Rebuild
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleEmulatorDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-NST-FPS-TREO-debug
          path: extracted/J2ME_NST_FPS_Rebuild/app/build/outputs/apk/emulator/debug/*.apk
          if-no-files-found: error
          retention-days: 14
