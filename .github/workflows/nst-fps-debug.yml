name: Build J2ME NST FPS (debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;22.1.7171670"

      - name: Ensure TinySoundFont is present
        run: ./scripts/fetch-tinysoundfont.sh

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleEmulatorDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-NST-FPS-debug
          path: app/build/outputs/apk/emulator/debug/*.apk
          if-no-files-found: error
